experiment:
  id: v5_rgb_resnet50_scratch_seed42
  version: v5
  description: Optional V5 rgb ResNet50 scratch control.
seed: 42
data:
  dataset: eurosat
  input_type: rgb
  data_root: data/raw/rgb
  split_dir: data/splits
  bands:
  - B4
  - B3
  - B2
  split:
    strategy: stratified
    train_ratio: 0.8
    test_ratio: 0.2
model:
  name: resnet50
  num_classes: 10
  input_channels: 3
  pretrained: false
training:
  epochs: 50
  early_stopping:
    enabled: true
    monitor: macro_f1
    patience: 7
    min_delta: 0.001
  batch_size: 32
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  scheduler: none
evaluation:
  metrics:
  - accuracy
  - macro_f1
  - weighted_f1
  - balanced_accuracy
  - confusion_matrix
