[project]
name = "terrasight"
version = "0.1.0"
description = "EuroSAT RGB vs Multispectral Classification"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"